name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Python 3.12 tests and WSGI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements/test.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python scripts/smoke_wsgi.py
      - run: git diff --check
  container:
    name: Container build and empty-schema smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker build -t capstone-synthetic:test .
      - name: Exercise non-root container
        run: |
          docker run -d --name synthetic -p 127.0.0.1:18081:10000 \
            -e APP_ENV=synthetic -e SYNTHETIC_DATA_ONLY=true \
            -e DATABASE_URL=sqlite:////data/synthetic.db \
            -e SECRET_KEY=synthetic-container-session-00000000000000 \
            -e JWT_SECRET_KEY=synthetic-container-jwt-000000000000000000 \
            -e ENCRYPTION_KEY=$(python -c "import base64; print(base64.urlsafe_b64encode(b'0'*32).decode())") \
            -e TRUSTED_HOSTS=127.0.0.1 capstone-synthetic:test
          trap 'docker logs synthetic; docker rm -f synthetic' EXIT
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:18081/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/get_audit_logs)" = 401
          test "$(docker exec synthetic id -u)" = 10001
  dependencies:
    name: Runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      # Deliberately blocking: do not ignore vulnerabilities to get a green badge.
      - run: python -m pip_audit -r requirements/runtime.txt
