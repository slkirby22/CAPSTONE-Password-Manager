<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Create Employee</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-5.3.5/css/bootstrap.min.css') }}">
        <link rel="icon" href="{{ url_for('favicon') }}">
    </head>
    <body>
        <header>
            <h1>Create New Employee</h1>
        </header>
        <body>
            <form action="{{ url_for('create_user_route') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" autocomplete="off" required>
                <br><br>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" autocomplete="off" required>
                <br><br>

                <label for="role">Role:</label>
                <select name="role" id="role">
                    <option value="employee">Employee</option>
                    {% if current_user_role == 'admin' %}
                        <option value="manager">Manager</option>
                        <option value="admin">Admin</option>
                    {% endif %}
                </select>
                <br><br>

                <button type="submit" class="btn btn-primary">Create User</button>
            </form>
            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}
            <br>

            <div id="back-to-dashboard">
                <a href="{{ url_for('dashboard_route') }}" class="btn btn-warning">Back to Dashboard</a>
            </div>
        </body>
        <script src="{{ url_for('static', filename='vendor/bootstrap-5.3.5/js/bootstrap.min.js') }}"></script>
    </body>
</html>
